<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calc-box">
        <h2>Калькулятор</h2>
        <div class="inputs">
            <input type="text" id="num1" placeholder="Первое число">
            <input type="text" id="num2" placeholder="Второе число">
        </div>
        <div class="buttons">
            <button id="btn-sum">сумма</button>
            <button id="btn-sub">разность</button>
            <button id="btn-mul">произведение</button>
            <button id="btn-div">деление</button>
        </div>
        <div id="result" class="result-window"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
